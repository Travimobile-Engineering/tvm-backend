name: Propose backend production release

on:
  workflow_run:
    workflows:
      - Backend CI
      - Laravel Backend CI/CD Migration
      - Build and Push Travi Backend Image to Docker Hub
      - Build and Push Travi Backend Nginx Image to Docker Hub
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-promotion
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Check release eligibility

    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      ready: ${{ steps.check.outputs.ready }}
      source_sha: ${{ steps.check.outputs.source_sha }}

    steps:
      - name: Require all workflows to pass for the same commit
        id: check

        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]

          required = {
              "Backend CI",
              "Laravel Backend CI/CD Migration",
              "Build and Push Travi Backend Image to Docker Hub",
              "Build and Push Travi Backend Nginx Image to Docker Hub",
          }

          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com/" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return json.load(response)

          branch = get(f"repos/{repository}/branches/master")

          if branch["commit"]["sha"] != sha:
              raise SystemExit(
                  "A newer source commit exists. "
                  "Skipping this older release."
              )

          latest = {}
          page = 1

          while True:
              result = get(
                  f"repos/{repository}/actions/runs"
                  f"?head_sha={sha}&per_page=100&page={page}"
              )

              runs = result["workflow_runs"]

              for run in runs:
                  if (
                      run["name"] not in required
                      or run["event"] != "push"
                      or run["head_branch"] != "master"
                  ):
                      continue

                  previous = latest.get(run["name"])

                  if previous is None or run["id"] > previous["id"]:
                      latest[run["name"]] = run

              if len(runs) < 100:
                  break

              page += 1

          ready = True
          lines = []

          for name in sorted(required):
              run = latest.get(name)

              if run is None:
                  ready = False
                  lines.append(f"- {name}: missing")
                  continue

              lines.append(
                  f"- {name}: {run['status']} / {run['conclusion']}"
              )

              if (
                  run["status"] != "completed"
                  or run["conclusion"] != "success"
              ):
                  ready = False

          print("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={str(ready).lower()}\n")
              output.write(f"source_sha={sha}\n")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a"
          ) as summary:
              summary.write(
                  f"## Promotion eligibility\n\nCommit: {sha}\n\n"
              )
              summary.write("\n".join(lines))
              summary.write(f"\n\nReady: {ready}\n")

          if not ready:
              print(
                  "No production PR: checks are missing, "
                  "running or unsuccessful."
              )
          PY

  propose:
    name: Open production image-update PR

    needs: verify

    if: needs.verify.outputs.ready == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - name: Check GitOps credential
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::GITOPS_TOKEN is missing."
            exit 1
          }

      - name: Checkout GitOps production configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Travimobile-Engineering/gitops
          ref: new-iac
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

        run: |
          set -euo pipefail

          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_TOKEN"

          printf '%s' "$DOCKER_TOKEN" |
            docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

      - name: Read the already-published image digests
        run: |
          set -euo pipefail

          TAG="${SOURCE_SHA:0:7}-prod"

          BACKEND_DIGEST=$(
            docker buildx imagetools inspect \
              "docker.io/travi3/backend:$TAG" |
              awk '$1 == "Digest:" {print $2; exit}'
          )

          NGINX_DIGEST=$(
            docker buildx imagetools inspect \
              "docker.io/travi3/backend-nginx-prod:$TAG" |
              awk '$1 == "Digest:" {print $2; exit}'
          )

          [[ "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$NGINX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "BACKEND_DIGEST=$BACKEND_DIGEST" >> "$GITHUB_ENV"
          echo "NGINX_DIGEST=$NGINX_DIGEST" >> "$GITHUB_ENV"

      - name: Install YAML editor
        run: python3 -m pip install PyYAML==6.0.2

      - name: Update backend and Nginx image references
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import yaml

          path = pathlib.Path(
              "services/backend/overlays/prod/kustomization.yaml"
          )

          data = yaml.safe_load(path.read_text())

          replacements = {
              "docker.io/travi3/backend":
                  os.environ["BACKEND_DIGEST"],
              "docker.io/travi3/backend-nginx":
                  os.environ["NGINX_DIGEST"],
          }

          found = set()

          for image in data.get("images", []):
              name = image.get("name")

              if name not in replacements:
                  continue

              if name in found:
                  raise SystemExit("Duplicate image entry: " + name)

              if name == "docker.io/travi3/backend":
                  if image.get("newName", name) != name:
                      raise SystemExit("Unexpected backend mapping.")

              if name == "docker.io/travi3/backend-nginx":
                  if image.get("newName") != (
                      "docker.io/travi3/backend-nginx-prod"
                  ):
                      raise SystemExit("Unexpected Nginx mapping.")

              image.pop("newTag", None)
              image["digest"] = replacements[name]
              found.add(name)

          if found != set(replacements):
              raise SystemExit("Required image entries are missing.")

          path.write_text(
              yaml.safe_dump(data, sort_keys=False)
          )
          PY

      - name: Create production promotion PR
        run: |
          set -euo pipefail

          BRANCH="promote/backend-$SOURCE_SHA"

          EXISTING_PR=$(
            gh pr list \
              --repo Travimobile-Engineering/gitops \
              --base new-iac \
              --head "$BRANCH" \
              --state all \
              --json url \
              --jq '.[0].url // empty'
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "Existing release PR: $EXISTING_PR"
            exit 0
          fi

          if git diff --quiet -- \
            services/backend/overlays/prod/kustomization.yaml
          then
            echo "Production already references these images."
            exit 0
          fi

          git switch -c "$BRANCH"

          git config user.name "backend-release-bot"
          git config user.email \
            "backend-release-bot@users.noreply.github.com"

          git add \
            services/backend/overlays/prod/kustomization.yaml

          git commit -m "deploy: promote backend $RELEASE_TAG"

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" >/dev/null
          then
            echo "Using the existing promotion branch."
          else
            git push origin "$BRANCH"
          fi

          cat > /tmp/release-pr.md <<EOF
          Production release for backend source commit:

          $SOURCE_SHA

          Backend:
          docker.io/travi3/backend@$BACKEND_DIGEST

          Nginx:
          docker.io/travi3/backend-nginx-prod@$NGINX_DIGEST

          Required CI and both image publishers passed.
          No images were rebuilt by this workflow.

          Review migration compatibility and required backup/recovery
          safeguards before approving.

          Merging this PR changes production desired state.
          Argo CD automatic sync may deploy immediately after merge.
          EOF

          gh pr create \
            --repo Travimobile-Engineering/gitops \
            --base new-iac \
            --head "$BRANCH" \
            --title "deploy: promote backend $RELEASE_TAG" \
            --body-file /tmp/release-pr.md

      - name: Log out of Docker Hub
        if: always()
        run: docker logout