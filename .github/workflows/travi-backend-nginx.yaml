name: Build and Push Travi Backend Nginx Image to Docker Hub

on:
  push:
    branches: [ master, staging, dev ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build and push Docker image to Docker Hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name and tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          case "$GITHUB_REF_NAME" in
            master)
              IMAGE_NAME="travi3/backend-nginx-prod"
              TAG="${SHORT_SHA}-prod"
              ;;
            staging)
              IMAGE_NAME="travi3/backend-nginx-stg"
              TAG="${SHORT_SHA}-stg"
              ;;
            dev)
              IMAGE_NAME="travi3/backend-nginx-dev"
              TAG="${SHORT_SHA}-dev"
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using image: $IMAGE_NAME:$TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -f Dockerfile.nginx -t "$IMAGE_NAME:$TAG" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:$TAG"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout