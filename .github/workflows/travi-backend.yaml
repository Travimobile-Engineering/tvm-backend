name: Build and Push Travi Backend Image to Docker Hub

on:
  push:
    branches: [ master, staging ]   # rename master -> main if that is your prod branch

env:
  IMAGE_NAME_PROD: travi3/backend
  IMAGE_NAME_STAGING: travi3/backend-stg

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build and push Docker image to Docker Hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set image name and tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          case "$GITHUB_REF_NAME" in
            master)
              IMAGE_NAME="$IMAGE_NAME_PROD"
              TAG="${SHORT_SHA}-prod"
              ;;
            staging)
              IMAGE_NAME="$IMAGE_NAME_STAGING"
              TAG="${SHORT_SHA}-stg"
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          if [ -z "$IMAGE_NAME" ] || [ -z "$TAG" ]; then
            echo "IMAGE_NAME or TAG is empty"
            exit 1
          fi

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using image: $IMAGE_NAME:$TAG"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:$TAG" .

      - name: Push Docker image to Docker Hub
        run: docker push "$IMAGE_NAME:$TAG"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout