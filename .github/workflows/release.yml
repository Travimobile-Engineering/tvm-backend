name: Release backend to Kubernetes

on:
  push:
    branches:
      - new-iac
    paths:
      - services/backend/**

permissions:
  contents: read

concurrency:
  group: travi-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify backend

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: production

    env:
      ARGOCD_URL: https://argocd.travimobile.com
      ARGOCD_APPLICATION: travi-backend
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      GITOPS_REVISION: ${{ github.sha }}

    steps:
      - name: Synchronize approved GitOps revision
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          server = os.environ["ARGOCD_URL"].rstrip("/")
          app = os.environ["ARGOCD_APPLICATION"]
          token = os.environ.get("ARGOCD_AUTH_TOKEN", "")
          revision = os.environ["GITOPS_REVISION"].lower()

          if not token:
              raise SystemExit(
                  "ARGOCD_AUTH_TOKEN is missing from "
                  "the GitOps production environment."
              )

          if not re.fullmatch(r"[a-f0-9]{40}", revision):
              raise SystemExit("Invalid GitOps commit SHA.")

          def api(path, method="GET", payload=None):
              body = (
                  json.dumps(payload).encode()
                  if payload is not None
                  else None
              )

              request = urllib.request.Request(
                  server + "/api/v1/" + path,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"Argo CD API returned HTTP {error.code}."
                  )

              except urllib.error.URLError:
                  raise SystemExit(
                      "Cannot securely reach Argo CD."
                  )

          path = f"applications/{app}"

          def validate(application):
              spec = application.get("spec", {})
              source = spec.get("source", {})

              repository = source.get(
                  "repoURL", ""
              ).removesuffix(".git")

              if (
                  repository != (
                      "https://github.com/"
                      "Travimobile-Engineering/gitops"
                  )
                  or source.get("targetRevision") != "new-iac"
                  or source.get("path") != (
                      "services/backend/overlays/prod"
                  )
                  or spec.get("destination", {}).get(
                      "namespace"
                  ) != "travi"
              ):
                  raise SystemExit(
                      "Unexpected application source or destination."
                  )

          def healthy(application):
              status = application.get("status", {})
              sync = status.get("sync", {})
              operation = status.get("operationState", {})

              return (
                  not application.get("operation")
                  and operation.get("phase") not in (
                      "Running", "Terminating"
                  )
                  and sync.get("revision") == revision
                  and sync.get("status") == "Synced"
                  and status.get("health", {}).get(
                      "status"
                  ) == "Healthy"
              )

          application = api(path + "?refresh=hard")
          validate(application)

          desired = application.get(
              "status", {}
          ).get("sync", {}).get("revision")

          if desired != revision:
              raise SystemExit(
                  "Argo CD is resolving a different GitOps revision. "
                  "Check for a newer commit or refresh delay. "
                  "Refusing to force this release."
              )

          if not healthy(application):
              operation = application.get(
                  "status", {}
              ).get("operationState", {})

              active = (
                  application.get("operation")
                  or operation.get("phase") in (
                      "Running", "Terminating"
                  )
              )

              if active:
                  print(
                      "An Argo CD operation is already running. "
                      "Waiting for it."
                  )

              else:
                  print("Requesting Argo CD sync.")

                  api(
                      path + "/sync",
                      method="POST",
                      payload={
                          "revision": revision,
                          "prune": False,
                          "dryRun": False,
                      },
                  )

              deadline = time.monotonic() + 900

              while time.monotonic() < deadline:
                  application = api(
                      path + "?refresh=normal"
                  )
                  validate(application)

                  status = application.get("status", {})
                  sync = status.get("sync", {})
                  operation = status.get(
                      "operationState", {}
                  )

                  if sync.get("revision") not in (
                      None, revision
                  ):
                      raise SystemExit(
                          "GitOps desired revision changed. "
                          "Stopping this release verification."
                      )

                  failed_revision = operation.get(
                      "syncResult", {}
                  ).get("revision")

                  if (
                      failed_revision == revision
                      and operation.get("phase") in (
                          "Failed", "Error"
                      )
                      and not application.get("operation")
                  ):
                      raise SystemExit(
                          "Argo CD deployment failed. "
                          "Inspect the application operation."
                      )

                  if healthy(application):
                      break

                  print(
                      "Waiting for the approved revision "
                      "to become Synced and Healthy."
                  )
                  time.sleep(15)

              else:
                  raise SystemExit(
                      "Timed out waiting for deployment."
                  )

          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a"
          ) as summary:
              summary.write(
                  "## Backend deployment verified\n\n"
                  f"- Application: {app}\n"
                  f"- GitOps commit: {revision}\n"
                  "- Namespace: travi\n"
                  "- Argo CD: Synced and Healthy\n"
              )

          print(
              "Approved backend configuration "
              "is Synced and Healthy."
          )
          PY