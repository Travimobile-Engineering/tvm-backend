# Gitleaks configuration for tvm-backend.
#
# This file is auto-discovered by gitleaks (precedence: --config, GITLEAKS_CONFIG,
# GITLEAKS_CONFIG_TOML, then ./.gitleaks.toml) so no workflow flags are required.
#
# All default rules stay enabled - this only records REVIEWED, HISTORICAL
# findings so the scan fails on NEW leaks only.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Files that must never be committed. Both are gitignored today, so any hit is
# necessarily historical (or a regression that reintroduces them).
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Files that must never be committed (gitignored)"
paths = [
  '''(^|/)\.env\.testing$''',
  '''storage/app/firebase/firebase_credentials\.json$''',
]

# ---------------------------------------------------------------------------
# Historical leaks (committed 2024-12 -> 2026-04).
#
# Every finding tied to these commits was reviewed on 2026-10:
#   - the values are no longer present in the working tree (.env.sample and
#     .env.example now have empty values, config/app.php now reads
#     env('PAYSTACK_SECRET_KEY'), and the feature tests read the shared header
#     from config() instead of hardcoding it)
#   - the exposed credentials have been rotated
#
# Listing commits (not paths) is deliberate: a new leak in any of these files,
# on a new commit, will still fail the scan.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Reviewed historical leaks, removed from the working tree and rotated"
commits = [
  "c2aec586ac600c7c5a03213cdf5bbe98df089403",
  "9b908b764ee6fa583804c65ff7ddd073a03c87c0",
  "46e613981402e9f8628c47f57d54c208116c7ee6",
